name: Feature request
description: Suggest an improvement for Nova Studio
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement. Clear outcomes and workflow details help us prioritize requests.
  - type: input
    id: summary
    attributes:
      label: Feature summary
      description: What would you like Nova Studio to do?
      placeholder: Add batch image export presets
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow need
      description: What problem does this solve and who benefits?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the ideal user flow and result.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other solutions have you tried?
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Editor canvas
        - Media import
        - Image export
        - Video workflow
        - AI tools
        - Automation engine
        - Mobile experience
        - Authentication or storage
        - Developer API
        - Other
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Expected impact
      options:
        - Essential to my workflow
        - Significant time saver
        - Useful improvement
        - Nice to have
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References or examples
      description: Share links, mockups, or example workflows if useful.
